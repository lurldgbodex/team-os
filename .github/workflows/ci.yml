name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Hygiene check and bats tests
        run: bin/test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # -S warning fails on warnings and errors, not on style or info findings.
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
